apiVersion: apps/v1
kind: Deployment
metadata:
  name: central
  namespace: chat-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: central
  template:
    metadata:
      labels:
        app: central
    spec:
      containers:
      - name: central
        image: central:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 50051

