apiVersion: apps/v1
kind: Deployment
metadata:
  name: serverb
  namespace: chat-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: serverb
  template:
    metadata:
      labels:
        app: serverb
    spec:
      containers:
      - name: serverb
        image: serverb:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 50052

